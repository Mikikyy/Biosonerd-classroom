<!DOCTYPE html>
<html lang="th"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ห้องเรียนออนไลน์</title>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f6fb;--card:#fff;--tx:#1b2440;--mut:#6b7590;--pri:#2b3fbf;--acc:#ffd54a;--sky:#93cdf5;--bd:#e2e6f0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10142a;--card:#1a2040;--tx:#e8ecff;--mut:#98a2c8;--bd:#2c3466;--sky:#2a4d7a}}
:root[data-theme="dark"]{--bg:#10142a;--card:#1a2040;--tx:#e8ecff;--mut:#98a2c8;--bd:#2c3466;--sky:#2a4d7a}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font-family:Prompt,system-ui,sans-serif}
a{color:inherit;text-decoration:none}
#nav{display:flex;align-items:center;gap:6px;padding:8px 16px;background:var(--card);border-bottom:1px solid var(--bd);position:sticky;top:env(safe-area-inset-top,0px);z-index:20;flex-wrap:wrap}
#nav nav{display:flex;gap:4px;flex:1;flex-wrap:wrap}#nav nav a{padding:8px 12px;border-radius:8px;font-weight:500;color:var(--mut);cursor:pointer}#nav nav a:hover{background:var(--bd);color:var(--tx)}
.logo img{height:42px;display:block}.logo b{font-size:20px;color:var(--pri)}
.up{font-size:12px;cursor:pointer;background:var(--acc);color:#222;border-radius:6px;padding:2px 6px}
details.me{position:relative}details.me summary{list-style:none;cursor:pointer;padding:8px 14px;border-radius:20px;background:var(--acc);color:#222;font-weight:500}
details.me div{position:absolute;right:0;top:110%;background:var(--card);border:1px solid var(--bd);border-radius:10px;min-width:190px;padding:6px;box-shadow:0 8px 24px #0003}
details.me div a{display:block;padding:9px 12px;border-radius:6px}details.me div a:hover{background:var(--bd)}
.wrap{max-width:1100px;margin:0 auto;padding:22px 16px}
.car{position:relative;height:clamp(200px,38vw,420px);overflow:hidden;background:#111}
.sl{position:absolute;inset:0;opacity:0;transform:scale(1.06);transition:opacity .9s ease,transform 1.4s ease;background-size:cover;background-position:center;display:flex;align-items:center;justify-content:center;text-align:center;color:#fff;padding:20px}
.sl.on{opacity:1;transform:none}.g0{background-image:linear-gradient(120deg,#1a237e,#c62828)}.g1{background-image:linear-gradient(120deg,#004d40,#1565c0)}.g2{background-image:linear-gradient(120deg,#6a1b9a,#ef6c00)}
.sl h1{font-size:clamp(22px,5vw,46px);margin:0 0 6px}
.ar{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:44px;border-radius:50%;border:0;background:#0009;color:#fff;font-size:26px;cursor:pointer;z-index:2;transition:.2s}.ar:hover{background:#000c;scale:1.1}
.ar.l{left:14px}.ar.r{right:14px}
.dots{position:absolute;bottom:10px;width:100%;display:flex;justify-content:center;gap:7px;z-index:2}.dots i{width:9px;height:9px;border-radius:5px;background:#fff7;cursor:pointer;transition:.3s}.dots i.on{width:26px;background:#fff}
h2.t{text-align:center;margin:8px 0 20px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:18px}
.card{display:block;background:var(--card);border-radius:14px;overflow:hidden;border:1px solid var(--bd);transition:transform .25s ease,box-shadow .25s ease;cursor:pointer;position:relative}
.card:hover,.card:active{transform:translateY(-10px) scale(1.03);box-shadow:0 18px 34px #0003;z-index:2}
.cv{aspect-ratio:1/1;background:linear-gradient(135deg,var(--sky),var(--pri));background-size:cover;background-position:center}
.card h3{font-size:16px;margin:10px 12px 2px}.card p{margin:0 12px 12px;color:var(--pri);font-weight:600}
.btn{display:inline-block;border:0;border-radius:8px;padding:11px 20px;font:inherit;font-weight:600;cursor:pointer;background:var(--pri);color:#fff;text-align:center}.btn.o{background:transparent;color:var(--pri);border:2px solid var(--pri)}.btn.r{background:#d32f2f}.btn.s{padding:6px 12px;font-size:13px}
.box{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:18px;margin:14px 0}
label{display:block;margin:10px 0;font-size:14px;color:var(--mut)}input,textarea,select{width:100%;padding:10px;border:1px solid var(--bd);border-radius:8px;font:inherit;background:var(--bg);color:var(--tx);margin-top:4px}
.narrow{max-width:460px;margin:0 auto}
.det{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:24px}@media(max-width:760px){.det,.play{grid-template-columns:1fr!important}}
.det .cv{border-radius:14px}.thumbs{display:flex;gap:8px;margin-top:8px;overflow-x:auto}.thumbs div{width:70px;height:70px;border-radius:8px;flex:none;background-size:cover;background-position:center;cursor:pointer}
.price{font-size:28px;font-weight:600;color:var(--pri)}.pre{white-space:pre-wrap;line-height:1.7}
.tch{display:flex;gap:24px;align-items:center;flex-wrap:wrap}.ph{width:200px;height:200px;border-radius:50%;background:var(--sky) center/cover;flex:none}
.bar{height:8px;background:var(--bd);border-radius:5px;overflow:hidden;margin:6px 0}.bar i{display:block;height:100%;background:#43a047;transition:width .5s}
.play{display:grid;grid-template-columns:minmax(0,2.3fr) minmax(0,1fr);gap:20px;align-items:start}
.lt{background:var(--sky);text-align:center;padding:14px;font-size:20px;font-weight:600}
video,.doc{width:100%;aspect-ratio:16/9;background:#000;display:block;border:6px solid #bbb}.doc{background:var(--card);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px}
.st{background:var(--sky);padding:14px;text-align:center;font-weight:600}
details.ac{margin-top:2px}details.ac summary{background:var(--sky);padding:14px;cursor:pointer;font-weight:500;list-style:none;display:flex;justify-content:space-between}details.ac summary:after{content:"+"}details.ac[open] summary:after{content:"−"}
.li{display:block;padding:10px 14px;border-bottom:1px solid var(--bd);background:var(--card);font-size:14px}.li.cur{background:var(--acc);color:#222}.li:hover{filter:brightness(.95)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:space-between;margin-top:12px}
.mi{display:flex;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--bd);font-size:14px;justify-content:space-between}
.mi img,.mi .th{width:56px;height:56px;object-fit:cover;border-radius:6px}
.tag{font-size:12px;background:var(--acc);color:#222;border-radius:5px;padding:2px 7px}
.pl{aspect-ratio:16/9;background:#000;border:6px solid #bbb}.pl iframe{width:100%;height:100%;pointer-events:none;display:block}.ctl{display:flex;gap:10px;align-items:center;background:var(--card);padding:8px;border:1px solid var(--bd)}.ctl input{margin:0;flex:1}
</style></head><body>
