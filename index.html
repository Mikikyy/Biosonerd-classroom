<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ห้องเรียนออนไลน์</title>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f6fb;--card:#fff;--tx:#1b2440;--mut:#6b7590;--pri:#2b3fbf;--acc:#ffd54a;--sky:#93cdf5;--bd:#e2e6f0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10142a;--card:#1a2040;--tx:#e8ecff;--mut:#98a2c8;--bd:#2c3466;--sky:#2a4d7a}}
:root[data-theme="dark"]{--bg:#10142a;--card:#1a2040;--tx:#e8ecff;--mut:#98a2c8;--bd:#2c3466;--sky:#2a4d7a}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font-family:Prompt,system-ui,sans-serif}
a{color:inherit;text-decoration:none}
#nav{display:flex;align-items:center;gap:6px;padding:8px 16px;background:var(--card);border-bottom:1px solid var(--bd);position:sticky;top:env(safe-area-inset-top,0px);z-index:20;flex-wrap:wrap}
#nav nav{display:flex;gap:4px;flex:1;flex-wrap:wrap}#nav nav a{padding:8px 12px;border-radius:8px;font-weight:500;color:var(--mut);cursor:pointer}#nav nav a:hover{background:var(--bd);color:var(--tx)}
.logo img{height:42px;display:block}.logo b{font-size:20px;color:var(--pri)}
.up{font-size:12px;cursor:pointer;background:var(--acc);color:#222;border-radius:6px;padding:2px 6px}
details.me{position:relative}details.me summary{list-style:none;cursor:pointer;padding:8px 14px;border-radius:20px;background:var(--acc);color:#222;font-weight:500}
details.me div{position:absolute;right:0;top:110%;background:var(--card);border:1px solid var(--bd);border-radius:10px;min-width:190px;padding:6px;box-shadow:0 8px 24px #0003;z-index:10}
details.me div a{display:block;padding:9px 12px;border-radius:6px}details.me div a:hover{background:var(--bd)}
.wrap{max-width:1100px;margin:0 auto;padding:22px 16px}
.car{position:relative;height:clamp(200px,38vw,420px);overflow:hidden;background:#111}
.sl{position:absolute;inset:0;opacity:0;transform:scale(1.06);transition:opacity .9s ease,transform 1.4s ease;background-size:cover;background-position:center;display:flex;align-items:center;justify-content:center;text-align:center;color:#fff;padding:20px}
.sl.on{opacity:1;transform:none}.g0{background-image:linear-gradient(120deg,#1a237e,#c62828)}.g1{background-image:linear-gradient(120deg,#004d40,#1565c0)}.g2{background-image:linear-gradient(120deg,#6a1b9a,#ef6c00)}
.sl h1{font-size:clamp(22px,5vw,46px);margin:0 0 6px}
.ar{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:44px;border-radius:50%;border:0;background:#0009;color:#fff;font-size:26px;cursor:pointer;z-index:2;transition:.2s}.ar:hover{background:#000c;scale:1.1}
.ar.l{left:14px}.ar.r{right:14px}
.dots{position:absolute;bottom:10px;width:100%;display:flex;justify-content:center;gap:7px;z-index:2}.dots i{width:9px;height:9px;border-radius:5px;background:#fff7;cursor:pointer;transition:.3s}.dots i.on{width:26px;background:#fff}
h2.t{text-align:center;margin:8px 0 20px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:18px}
.card{display:block;background:var(--card);border-radius:14px;overflow:hidden;border:1px solid var(--bd);transition:transform .25s ease,box-shadow .25s ease;cursor:pointer;position:relative}
.card:hover,.card:active{transform:translateY(-10px) scale(1.03);box-shadow:0 18px 34px #0003;z-index:2}
.cv{aspect-ratio:1/1;background:linear-gradient(135deg,var(--sky),var(--pri));background-size:cover;background-position:center}
.card h3{font-size:16px;margin:10px 12px 2px}.card p{margin:0 12px 12px;color:var(--pri);font-weight:600}
.btn{display:inline-block;border:0;border-radius:8px;padding:11px 20px;font:inherit;font-weight:600;cursor:pointer;background:var(--pri);color:#fff;text-align:center}.btn.o{background:transparent;color:var(--pri);border:2px solid var(--pri)}.btn.r{background:#d32f2f}.btn.s{padding:6px 12px;font-size:13px}
.box{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:18px;margin:14px 0}
label{display:block;margin:10px 0;font-size:14px;color:var(--mut)}input,textarea,select{width:100%;padding:10px;border:1px solid var(--bd);border-radius:8px;font:inherit;background:var(--bg);color:var(--tx);margin-top:4px}
.narrow{max-width:460px;margin:0 auto}
.det{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:24px}@media(max-width:760px){.det,.play{grid-template-columns:1fr!important}}
.det .cv{border-radius:14px}.thumbs{display:flex;gap:8px;margin-top:8px;overflow-x:auto}.thumbs div{width:70px;height:70px;border-radius:8px;flex:none;background-size:cover;background-position:center;cursor:pointer}
.price{font-size:28px;font-weight:600;color:var(--pri)}.pre{white-space:pre-wrap;line-height:1.7}
.tch{display:flex;gap:24px;align-items:center;flex-wrap:wrap}.ph{width:200px;height:200px;border-radius:50%;background:var(--sky) center/cover;flex:none}
.bar{height:8px;background:var(--bd);border-radius:5px;overflow:hidden;margin:6px 0}.bar i{display:block;height:100%;background:#43a047;transition:width .5s}
.play{display:grid;grid-template-columns:minmax(0,2.3fr) minmax(0,1fr);gap:20px;align-items:start}
.lt{background:var(--sky);text-align:center;padding:14px;font-size:20px;font-weight:600}
video,.doc{width:100%;aspect-ratio:16/9;background:#000;display:block;border:6px solid #bbb}.doc{background:var(--card);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px}
.st{background:var(--sky);padding:14px;text-align:center;font-weight:600}
details.ac{margin-top:2px}details.ac summary{background:var(--sky);padding:14px;cursor:pointer;font-weight:500;list-style:none;display:flex;justify-content:space-between}details.ac summary:after{content:"+"}details.ac[open] summary:after{content:"−"}
.li{display:block;padding:10px 14px;border-bottom:1px solid var(--bd);background:var(--card);font-size:14px}.li.cur{background:var(--acc);color:#222}.li:hover{filter:brightness(.95)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:space-between;margin-top:12px}
.mi{display:flex;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--bd);font-size:14px;justify-content:space-between}
.mi img,.mi .th{width:56px;height:56px;object-fit:cover;border-radius:6px}
.tag{font-size:12px;background:var(--acc);color:#222;border-radius:5px;padding:2px 7px}
.pl{position:relative;aspect-ratio:16/9;background:#000;border:6px solid #bbb}.tap{position:absolute;inset:0;z-index:1;cursor:pointer}.pl iframe{width:100%;height:100%;pointer-events:none;display:block}
.ctl{display:flex;gap:8px;align-items:center;background:var(--card);padding:8px 10px;border:1px solid var(--bd);flex-wrap:wrap}.ctl input[type="range"]{margin:0;flex:1;padding:0;accent-color:var(--pri)}.ctl span{font-size:13px;white-space:nowrap;color:var(--mut)}
.ctl select{width:auto;padding:4px 8px;margin-top:0;font-size:12px;border-radius:6px}
.cb{width:36px;height:36px;border-radius:50%;border:0;background:var(--bd);color:var(--tx);display:grid;place-items:center;cursor:pointer;flex:none;transition:.15s;font-weight:600;font-size:12px}.cb:hover{background:var(--acc);color:#222;transform:scale(1.08)}.cb.big{width:44px;height:44px;background:var(--pri);color:#fff}.cb.big:hover{background:var(--pri);color:#fff}.cb svg{width:18px;height:18px}
.cb.active{background:var(--pri);color:#fff}
.plw:fullscreen,.plw.fsx{background:#000;display:flex;flex-direction:column;width:100%;height:100%}.plw.fsx{position:fixed;inset:0;z-index:100}.plw:fullscreen .pl,.plw.fsx .pl{flex:1;aspect-ratio:auto;border:0}.plw:fullscreen .ctl,.plw.fsx .ctl{background:#111;color:#fff;border:0}.plw:fullscreen .ctl span,.plw.fsx .ctl span{color:#ddd}
.pw{position:relative;display:block}.pw input{padding-right:46px}.eye{position:absolute;right:8px;bottom:7px;height:30px;border:0;background:none;font-size:20px;cursor:pointer;padding:0 6px}
#dbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:#1b2440;color:#fff;padding:10px 16px;border-radius:30px;display:none;gap:14px;align-items:center;z-index:60;box-shadow:0 8px 24px #0005;white-space:nowrap}.toast{position:fixed;top:70px;left:50%;transform:translateX(-50%);background:#2e7d32;color:#fff;padding:10px 20px;border-radius:30px;z-index:70;box-shadow:0 6px 18px #0004}
</style>
</head>
<body>
<header id="nav"></header><main id="app"></main>
<footer class="wrap" style="text-align:center;color:var(--mut);font-size:13px">© ห้องเรียนออนไลน์</footer>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import {getAuth,GoogleAuthProvider,signInWithPopup,signOut,onAuthStateChanged,signInWithEmailAndPassword,EmailAuthProvider,linkWithCredential} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import {getFirestore,doc,getDoc,setDoc,deleteDoc,collection,getDocs,query,where} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

/* ===== ข้อมูล ===== */
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9),fmt=s=>Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0');

/* ===== Firebase ===== */
const firebaseConfig={apiKey:"AIzaSyD2JFWyUfXjmLrEiT6MqYDbc2D1VoQfmtY",authDomain:"biosonerd-classroom.firebaseapp.com",projectId:"biosonerd-classroom",storageBucket:"biosonerd-classroom.firebasestorage.app",messagingSenderId:"322744850638",appId:"1:322744850638:web:71de9a87e0d3ef09d6d89f"};
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app);
const mail=id=>`${id}@student.biosonerd.app`;
const st={courses:[],banners:[],logo:'',intro:{name:'ครูผู้สอน',bio:'',photo:''},own:[],cart:[],prog:{},me:null};
let ses=null,ready=false,tm,yp,yt,ci=0,ct,pend=0,dirty=false,ccTrack=false;

const sv=(d,x='')=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${d}${x}</svg>`;
const IC={
  play:`<svg viewBox="0 0 24 24"><path fill="currentColor" d="M8 5v14l11-7z"/></svg>`,
  pause:`<svg viewBox="0 0 24 24"><path fill="currentColor" d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>`,
  back:sv('<path d="M4 12a8 8 0 1 0 3-6.2M4 4v4h4"/>','<text x="12" y="15.5" font-size="8" text-anchor="middle" fill="currentColor" stroke="none">10</text>'),
  fwd:sv('<path d="M20 12a8 8 0 1 1-3-6.2M20 4v4h-4"/>','<text x="12" y="15.5" font-size="8" text-anchor="middle" fill="currentColor" stroke="none">10</text>'),
  fs:sv('<path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/>')
};

const furl=async k=>k;
const img=(f,w=700,q=.6)=>new Promise((r,rej)=>{const i=new Image();i.onload=()=>{const k=Math.min(1,w/i.width),c=document.createElement('canvas');c.width=i.width*k;c.height=i.height*k;c.getContext('2d').drawImage(i,0,0,c.width,c.height);r(c.toDataURL('image/jpeg',q))};i.onerror=()=>rej(new Error('อ่านไฟล์รูปไม่ได้ ใช้ไฟล์ JPG หรือ PNG'));i.src=URL.createObjectURL(f)});
const showD=()=>{let b=$('#dbar');if(!b){b=document.createElement('div');b.id='dbar';b.innerHTML='<span>● มีการแก้ไขที่ยังไม่ได้บันทึก</span><button class="btn s" onclick="saveNow()">💾 บันทึก</button>';document.body.appendChild(b)}b.style.display=dirty?'flex':'none'};
const toast=m=>{const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2200)};
const save=()=>{if(ses&&ses.t){dirty=true;showD()}else{clearTimeout(tm);tm=setTimeout(push,500)}};
addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue=''}});

async function push(){try{if(!ses)return;const j=[];
  if(ses.t){j.push(setDoc(doc(db,'site','main'),{banners:st.banners,logo:st.logo,intro:st.intro}));
   for(const c of st.courses){const p=JSON.parse(JSON.stringify(c)),u={};[...p.docs,...p.secs.flatMap(s=>s.ls)].forEach(l=>{u[l.id]=l.url||'';delete l.url});j.push(setDoc(doc(db,'courses',c.id),p),setDoc(doc(db,'courseContent',c.id),{u}))}}
  else j.push(setDoc(doc(db,'users',ses.id),{...st.me,own:st.own,cart:st.cart,prog:st.prog}));
  await Promise.all(j);return true}catch(e){console.error(e);alert('บันทึกไม่สำเร็จ: '+(e.code||e.message));return false}}
const saveNow=async()=>{clearTimeout(tm);if(await push()){dirty=false;showD();toast('✓ บันทึกข้อมูลลงเว็บแล้ว')}};
addEventListener('unhandledrejection',e=>alert('เกิดข้อผิดพลาด: '+(e.reason?.message||e.reason?.code||e.reason)));

async function loadContent(c){if(!c)return;try{const u=(await getDoc(doc(db,'courseContent',c.id))).data()?.u||{};[...c.docs,...c.secs.flatMap(s=>s.ls)].forEach(l=>l.url=u[l.id]||'')}catch(e){}}
async function loadAll(u){dirty=false;showD();ses=null;st.me=null;st.own=[];st.cart=[];st.prog={};let adm=false;
  if(u){try{await getDoc(doc(db,'adminCheck','x'));adm=true}catch{}
   if(adm)ses={t:1,id:u.uid};else{const d=await getDoc(doc(db,'users',u.uid));if(d.exists()){const {own,cart,prog,...m}=d.data();st.me=m;st.own=own||[];st.cart=cart||[];st.prog=prog||{};ses={id:u.uid}}}}
  Object.assign(st,{banners:[],logo:'',intro:{name:'ครูผู้สอน',bio:'',photo:''}});
  const s=await getDoc(doc(db,'site','main'));if(s.exists())Object.assign(st,s.data());
  const q=adm?collection(db,'courses'):query(collection(db,'courses'),where('pub','==',true));
  st.courses=(await getDocs(q)).docs.map(d=>({id:d.id,...d.data()}));
  for(const c of st.courses)if(adm||st.own.includes(c.id))await loadContent(c)}
onAuthStateChanged(auth,async u=>{try{await loadAll(u)}catch(e){console.error(e)}ready=true;route()});

function ytId(u){const m=String(u).match(/(?:v=|youtu\.be\/|embed\/|shorts\/|live\/)([\w-]{11})/);return m&&m[1]}

/* ===== ฟังก์ชันควบคุมวิดีโอ ===== */
const vp=(a,val)=>{if(!yp||!yp.getPlayerState)return;
  const t=yp.getCurrentTime(),d=yp.getDuration()||0;
  if(a==='t')yp.getPlayerState()==1?yp.pauseVideo():yp.playVideo();
  else if(a==='f')yp.seekTo(Math.min(d,t+10),true);
  else if(a==='b')yp.seekTo(Math.max(0,t-10),true);
  else if(a==='rate')yp.setPlaybackRate(parseFloat(val));
  else if(a==='quality')yp.setPlaybackQuality(val);
  else if(a==='cc'){
    ccTrack = !ccTrack;
    if(ccTrack){ yp.loadModule('captions'); yp.setOption('captions', 'track', {'languageCode': 'th'}); }
    else { yp.unloadModule('captions'); }
    $('#ccBtn')?.classList.toggle('active', ccTrack);
  }
  else if(a==='fs'){const e=$('#plw');if(document.fullscreenElement||document.webkitFullscreenElement)(document.exitFullscreen||document.webkitExitFullscreen).call(document);else if(e.classList.contains('fsx'))e.classList.remove('fsx');else{const r=e.requestFullscreen||e.webkitRequestFullscreen;if(r){try{const q=r.call(e);q&&q.catch&&q.catch(()=>e.classList.add('fsx'))}catch{e.classList.add('fsx')}}else e.classList.add('fsx')}}
};

addEventListener('keydown',e=>{const n=e.target.tagName;if(!$('#yt')||n==='TEXTAREA'||n==='SELECT'||(n==='INPUT'&&e.target.type!=='range')||(n==='BUTTON'&&e.key===' '))return;
  if(e.key==='ArrowRight'){vp('f');e.preventDefault()}else if(e.key==='ArrowLeft'){vp('b');e.preventDefault()}else if(e.key===' '||e.key==='k'){vp('t');e.preventDefault()}else if(e.key==='f')vp('fs')});

function initYT(url){const id=ytId(url);if(!id){$('.pl').innerHTML='<div class="doc">ลิงก์วิดีโอไม่ถูกต้อง</div>';return}
  ccTrack = false;
  const go=()=>{yp=new YT.Player('yt',{host:'https://www.youtube-nocookie.com',videoId:id,playerVars:{controls:0,rel:0,iv_load_policy:3,disablekb:1,playsinline:1,fs:0,cc_load_policy:1},events:{
    onStateChange:e=>{const b=$('#pp');if(b)b.innerHTML=e.data==1?IC.pause:IC.play},
    onReady:()=>{
      yt=setInterval(()=>{if(!$('#sk')||!yp.getDuration)return;const d=yp.getDuration()||1,t=yp.getCurrentTime();$('#sk').value=t/d*1000;$('#tm').textContent=fmt(t)+' / '+fmt(d)},500);
      // โหลดตัวเลือก ความคมชัด
      if(yp.getAvailableQualityLevels){
        const ql=yp.getAvailableQualityLevels();
        const qSel=$('#qSel');
        if(qSel && ql.length){
          qSel.innerHTML = '<option value="default">ความคมชัด (Auto)</option>' + ql.map(q=>`<option value="${q}">${q}</option>`).join('');
        }
      }
    }
  }})};
  if(window.YT&&YT.Player)go();else{window.onYouTubeIframeAPIReady=go;const e=document.createElement('script');e.src='https://www.youtube.com/iframe_api';document.head.appendChild(e)}
  if($('#sk')) $('#sk').oninput=e=>yp&&yp.seekTo(yp.getDuration()*e.target.value/1000,true)
}

const isT=()=>!!(ses&&ses.t),key=()=>ses?ses.id:null,me=()=>ses&&(ses.t?{name:'ครูผู้สอน',nick:'ครู'}:st.me);
const own=()=>st.own,cart=()=>st.cart;
const C=id=>st.courses.find(c=>c.id===id),pubs=()=>st.courses.filter(c=>c.pub);
const lessons=c=>c.secs.flatMap(s=>s.ls),hh=s=>(s/3600).toFixed(1);
const prog=c=>{const l=lessons(c),d=st.prog[c.id]||[],n=l.filter(x=>d.includes(x.id));return{p:l.length?Math.round(n.length/l.length*100):0,h:n.reduce((a,x)=>a+x.dur,0),H:l.reduce((a,x)=>a+x.dur,0),d}};
const ph=(k,b)=>k?`data-bg="${k}"`:'';

/* ===== Navbar ===== */
function nav(){const m=me();$('#nav').innerHTML=`<a class="logo" href="#/">${st.logo?`<img data-k="${st.logo}" alt="logo">`:'<b>LOGO</b>'}</a>${isT()?`<label class="up">⬆ โลโก้<input type="file" accept="image/*" hidden onchange="A.logo(this)"></label>`:''}
<nav><a href="#/courses">คอร์สทั้งหมด</a><a onclick="A.goT()">แนะนำผู้สอน</a><a href="#/cart">🛒 ตะกร้า${cart().length?` (${cart().length})`:''}</a>${m?'<a href="#/my">คอร์สเรียนของฉัน</a>':''}</nav>
${m?`<details class="me"><summary>👤 ${esc(m.nick||m.name)}</summary><div><a href="#/my">คอร์สเรียนของฉัน</a>${isT()?'<a href="#/teach">⚙ จัดการเว็บ (ครู)</a>':'<a href="#/profile">แก้ไขข้อมูลส่วนตัว</a>'}<a onclick="A.out()" style="cursor:pointer">ออกจากระบบ</a></div></details>`:'<a class="btn s" href="#/login">สมัครสมาชิก / เข้าสู่ระบบ</a>'}`}

/* ===== Views ===== */
const card=c=>`<a class="card" href="#/course/${c.id}"><div class="cv" ${ph(c.cover)}></div><h3>${esc(c.title)}</h3><p>${c.price?c.price.toLocaleString()+' ฿':'ฟรี'}</p></a>`;
function vHome(){const bs=st.banners.length?st.banners.map(k=>`<div class="sl" data-bg="${k}"></div>`):[['ยินดีต้อนรับสู่ห้องเรียนออนไลน์','เรียนได้ทุกที่ ทุกเวลา'],['คอร์สใหม่ อัปเดตล่าสุด','ดูคอร์สแนะนำด้านล่าง'],['สมัครสมาชิกวันนี้','รับรหัสนักเรียนทันที']].map((t,i)=>`<div class="sl g${i}"><div><h1>${t[0]}</h1><p>${t[1]}</p></div></div>`);

return `<div class="car">${bs.join('')}<button class="ar l" onclick="sl(-1)">‹</button><button class="ar r" onclick="sl(1)">›</button><div class="dots">${bs.map((_,j)=>`<i onclick="sl(0,${j})"></i>`).join('')}</div></div>

const A={need(){location.hash='#/login';return''},

cart(id){if(!ses)return A.need();const a=st.cart,j=a.indexOf(id);j>=0?a.splice(j,1):a.push(id);save();route()},
async buy(id){if(!ses)return A.need();if(!confirm('ยืนยันสั่งซื้อคอร์สนี้? (ระบบจำลอง ยังไม่ต้องชำระเงิน)'))return;st.own.includes(id)||st.own.push(id);st.cart=st.cart.filter(x=>x!==id);await push();await loadContent(C(id));location.hash='#/my'},
async login(e){e.preventDefault();const f=new FormData(e.target);try{await signInWithEmailAndPassword(auth,mail(f.get('id')),f.get('pw'));location.hash='#/my'}catch{alert('รหัสนักเรียนหรือรหัสผ่านไม่ถูกต้อง')}return false},
async gmail(){try{const r=await signInWithPopup(auth,new GoogleAuthProvider());await loadAll(r.user);if(!ses){alert('ยังไม่พบบัญชีที่ผูกกับ Gmail นี้ กรุณาสมัครสมาชิกก่อน');await signOut(auth);location.hash='#/register';return}location.hash='#/my';route()}catch(x){alert('เข้าสู่ระบบไม่สำเร็จ: '+(x.code||x.message))}},
async reg(e){e.preventDefault();const f=Object.fromEntries(new FormData(e.target));try{const r=await signInWithPopup(auth,new GoogleAuthProvider());
  if((await getDoc(doc(db,'users',r.user.uid))).exists()){alert('บัญชี Google นี้สมัครไว้แล้ว ใช้ปุ่มเข้าสู่ระบบด้วย Gmail ได้เลย');return false}
  let id=null;for(let t=0;t<8&&!id;t++){const c=String(10000+Math.floor(Math.random()*90000));try{await linkWithCredential(r.user,EmailAuthProvider.credential(mail(c),f.pw));id=c}catch(x){if(x.code!=='auth/email-already-in-use')throw x}}
  if(!id)throw{code:'สุ่มรหัสไม่สำเร็จ ลองใหม่'};
  const {pw,...p}=f;await setDoc(doc(db,'users',r.user.uid),{...p,sid:id,gmail:r.user.email,own:[],cart:[],prog:{}});
  await loadAll(r.user);alert('สมัครสมาชิกสำเร็จ!\nรหัสนักเรียนของคุณคือ '+id);location.hash='#/my';route()}catch(x){alert('สมัครไม่สำเร็จ: '+(x.code||x.message))}return false},
prof(e){e.preventDefault();Object.assign(st.me,Object.fromEntries(new FormData(e.target)));save();alert('บันทึกแล้ว');route();return false},

newC(){const c={id:uid(),title:'คอร์สใหม่',price:0,desc:'',cover:'',imgs:[],docs:[],secs:[],pub:false,feat:false};st.courses.push(c);save();location.hash='#/edit/'+c.id},
delC(id){if(confirm('ลบคอร์สนี้?')){st.courses=st.courses.filter(c=>c.id!==id);deleteDoc(doc(db,'courses',id));deleteDoc(doc(db,'courseContent',id));route()}},
ban:async i=>{for(const f of i.files)if(st.banners.length<4)st.banners.push(await img(f,1200,.6));save();route()},rmBan(j){st.banners.splice(j,1);save();route()},
tphoto:async i=>{st.intro.photo=await img(i.files[0],400,.7);save();route()},
cover:async i=>{ec.cover=await img(i.files[0]);save();route()},
imgs:async i=>{for(const f of i.files)if(ec.imgs.length<4)ec.imgs.push(await img(f));save();route()},rmI(j){ec.imgs.splice(j,1);save();route()},
addS(){const t=prompt('ชื่อหัวข้อใหญ่');if(t){ec.secs.push({id:uid(),title:t,ls:[]});save();route()}},
rmS(j){if(confirm('ลบหัวข้อนี้?')){ec.secs.splice(j,1);save();route()}},
addL(s){const t=$('#t-'+s).value.trim(),u=$('#u-'+s).value.trim();if(!u)return alert('ใส่ลิงก์ก่อน');g(ec,s).push({id:uid(),title:t||'บทเรียน',url:u,type:s==='d'?'doc':'video',dur:s==='d'?0:(+($('#d-'+s)?.value)||0)*60});save();route()},
rmL(s,j){g(ec,s).splice(j,1);save();route()}};
